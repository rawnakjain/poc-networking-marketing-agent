<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Marketing Matchmaking Agent Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .simulation-area {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
            min-height: 500px;
        }

        .participant {
            flex: 1;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .participant-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .participant-header h2 {
            margin: 0;
            font-size: 1.5em;
        }

        .participant-header p {
            margin: 5px 0 0;
            opacity: 0.9;
            font-size: 0.9em;
        }

        .chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            line-height: 1.4;
        }

        .agent-message {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .participant-message {
            background: #e3f2fd;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message.sender {
            background: #d4edda;
            align-self: flex-end;
        }

        .agent {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100;
            transition: all 0.5s ease;
        }

        .agent::after {
            content: '🤖';
            font-size: 1.5em;
        }

        .controls {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 0 10px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            background: #ecf0f1;
            border-radius: 10px;
            font-weight: 500;
        }

        .recommendation {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .recommendation h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .recommendation p {
            font-size: 1.1em;
            color: #34495e;
        }

        @media (max-width: 768px) {
            .simulation-area {
                flex-direction: column;
            }

            .participant {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Salon Marketing Matchmaking Agent</h1>
        <p style="text-align: center; color: #7f8c8d; margin-bottom: 30px;">
            Watch the AI agent match salon owners with marketing professionals
        </p>

        <div class="simulation-area">
            <!-- Salon Owner Panel -->
            <div class="participant" id="salon-owner">
                <div class="participant-header">
                    <h2>Salon Owner</h2>
                    <p>Glow Up Salon, Mumbai</p>
                </div>
                <div class="chat-window" id="salon-owner-chat"></div>
            </div>

            <!-- Marketing Freelancer Panel -->
            <div class="participant" id="freelancer">
                <div class="participant-header">
                    <h2>Marketing Freelancer</h2>
                    <p>Arjun - Social Media Specialist</p>
                </div>
                <div class="chat-window" id="freelancer-chat"></div>
            </div>

            <!-- Marketing Agency Panel -->
            <div class="participant" id="agency">
                <div class="participant-header">
                    <h2>Marketing Agency</h2>
                    <p>PixelPulse Marketing</p>
                </div>
                <div class="chat-window" id="agency-chat"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="start-btn">Start Simulation</button>
            <button class="btn" id="pause-btn" disabled>Pause</button>
            <button class="btn" id="reset-btn" disabled>Reset</button>
            <button class="btn" id="step-btn" disabled>Step Forward</button>
        </div>

        <div class="status" id="status">Ready to start simulation...</div>

        <div class="recommendation" id="recommendation">
            <h3>Match Recommendation</h3>
            <p id="recommendation-text"></p>
        </div>
    </div>

    <script>
        class MatchmakingSimulation {
            constructor() {
                this.agent = {
                    x: 0,
                    y: 0,
                    targetX: 0,
                    targetY: 0,
                    speed: 3,
                    moving: false
                };

                this.isPlaying = false;
                this.isPaused = false;
                this.currentStep = 0;
                this.steps = [];

                this.positions = {
                    'salon-owner': { x: 100, y: 100 },
                    'freelancer': { x: 500, y: 100 },
                    'agency': { x: 900, y: 100 }
                };

                this.initializeConversation();
                this.bindEvents();
                this.createAgentElement();
                this.updateStatus("Ready to start simulation...");
            }

            initializeConversation() {
                // Define the conversation flow
                this.steps = [
                    // Step 0: Introduction
                    {
                        type: 'move',
                        target: 'salon-owner',
                        delay: 500
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'salon-owner',
                        text: "Hello! I'm your marketing matchmaking agent. To get started, could you tell me your salon's name and location?",
                        delay: 1000
                    },
                    {
                        type: 'message',
                        from: 'salon-owner',
                        to: 'agent',
                        text: "Hi! I'm Priya from 'Glow Up Salon' in Mumbai.",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'salon-owner',
                        text: "Wonderful! What's your main marketing objective for the upcoming Diwali season?",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'salon-owner',
                        to: 'agent',
                        text: "I want to increase bookings through better Instagram content and targeted ad campaigns, but I need to keep my budget under ₹15,000.",
                        delay: 2000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'salon-owner',
                        text: "Got it. Do you have any specific preferences for content style or campaign type?",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'salon-owner',
                        to: 'agent',
                        text: "I prefer vibrant, festive posts that showcase our Diwali special packages and bridal makeup services. Short video reels would be great.",
                        delay: 2000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'salon-owner',
                        text: "How quickly do you need to see results or have content ready?",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'salon-owner',
                        to: 'agent',
                        text: "I'd like to start campaigns in two weeks, so content creation should happen within the next 10 days.",
                        delay: 2000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'salon-owner',
                        text: "Thank you, Priya. That's all I need from you for now.",
                        delay: 1500
                    },

                    // Move to freelancer
                    {
                        type: 'move',
                        target: 'freelancer',
                        delay: 1000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'freelancer',
                        text: "Hello! I'm matching salon owners with marketing professionals. Could you introduce yourself and your expertise?",
                        delay: 1000
                    },
                    {
                        type: 'message',
                        from: 'freelancer',
                        to: 'agent',
                        text: "Hi! I'm Arjun, a freelance social media manager specializing in beauty and wellness brands. I've worked with 15+ salons.",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'freelancer',
                        text: "Great! What services do you offer, and what's your typical pricing?",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'freelancer',
                        to: 'agent',
                        text: "I offer content creation (posts, reels, stories), community management, and basic ad campaign setup. My rate is ₹8,000 per month for a package including 12 posts, 4 reels, and weekly analytics.",
                        delay: 2000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'freelancer',
                        text: "What's your availability and typical turnaround time for content?",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'freelancer',
                        to: 'agent',
                        text: "I can start immediately and deliver content within 2-3 days of receiving brand guidelines. I'm available for 20 hours per week.",
                        delay: 2000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'freelancer',
                        text: "Do you have experience with Diwali campaigns or festive promotions for salons?",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'freelancer',
                        to: 'agent',
                        text: "Absolutely! I ran successful Diwali campaigns for three salons last year, boosting their bookings by 30-40% during the season.",
                        delay: 2000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'freelancer',
                        text: "Thank you, Arjun. That's helpful.",
                        delay: 1500
                    },

                    // Move to agency
                    {
                        type: 'move',
                        target: 'agency',
                        delay: 1000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'agency',
                        text: "Hello! I'm connecting salons with marketing partners. Could you tell me about your agency?",
                        delay: 1000
                    },
                    {
                        type: 'message',
                        from: 'agency',
                        to: 'agent',
                        text: "Hello! I'm Neha from 'PixelPulse Marketing', a boutique agency focused on lifestyle brands.",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'agency',
                        text: "What services do you provide, and what's your pricing model?",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'agency',
                        to: 'agent',
                        text: "We offer full-service marketing: strategy, content creation (photos/videos), ad campaign management, and influencer collaborations. Our salon starter package is ₹25,000/month.",
                        delay: 2000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'agency',
                        text: "What's your team size and capacity for new clients?",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'agency',
                        to: 'agent',
                        text: "We have a team of 5 and can take on 2-3 new salon clients per month. We typically deliver content calendars weekly.",
                        delay: 2000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'agency',
                        text: "Do you specialize in any particular types of salons or festivals like Diwali?",
                        delay: 1500
                    },
                    {
                        type: 'message',
                        from: 'agency',
                        to: 'agent',
                        text: "Yes! We specialize in premium salons and have done several festive campaigns. We know how to create high-impact Diwali offers that drive bookings.",
                        delay: 2000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'agency',
                        text: "Thank you, Neha. Appreciate the insights.",
                        delay: 1500
                    },

                    // Return to center and give recommendation
                    {
                        type: 'move',
                        target: 'center',
                        delay: 1000
                    },
                    {
                        type: 'message',
                        from: 'agent',
                        to: 'all',
                        text: "Based on the salon's budget (₹15,000/month), need for quick turnaround, and focus on Instagram content, the better match is the freelancer (Arjun) at ₹8,000/month. The agency exceeds the budget. I'll facilitate an introduction!",
                        delay: 2000,
                        showRecommendation: true
                    }
                ];
            }

            bindEvents() {
                document.getElementById('start-btn').addEventListener('click', () => this.start());
                document.getElementById('pause-btn').addEventListener('click', () => this.pause());
                document.getElementById('reset-btn').addEventListener('click', () => this.reset());
                document.getElementById('step-btn').addEventListener('click', () => this.step());
            }

            createAgentElement() {
                this.agentElement = document.createElement('div');
                this.agentElement.className = 'agent';
                document.body.appendChild(this.agentElement);

                // Start at center bottom
                this.agent.x = window.innerWidth / 2 - 30;
                this.agent.y = window.innerHeight - 100;
                this.agent.targetX = this.agent.x;
                this.agent.targetY = this.agent.y;
                this.updateAgentPosition();
            }

            updateAgentPosition() {
                this.agentElement.style.left = `${this.agent.x}px`;
                this.agentElement.style.top = `${this.agent.y}px`;
            }

            // Anchor to the panel's real on-screen box so the agent travels between
            // the actual participants, whatever the viewport size.
            getTargetPosition(target) {
                if (target === 'center') {
                    return { x: window.innerWidth / 2 - 30, y: window.innerHeight - 100 };
                }

                const panel = document.getElementById(target);
                if (panel) {
                    const rect = panel.getBoundingClientRect();
                    return {
                        x: rect.left + window.scrollX + rect.width / 2 - 30,
                        y: rect.top + window.scrollY + 30
                    };
                }

                const pos = this.positions[target] || { x: 0, y: 0 };
                return { x: pos.x - 30, y: pos.y - 30 };
            }

            async moveTo(target) {
                this.agent.moving = true;

                const dest = this.getTargetPosition(target);
                this.agent.targetX = dest.x;
                this.agent.targetY = dest.y;

                // Wait until we reach the target
                while (Math.abs(this.agent.x - this.agent.targetX) > 5 ||
                       Math.abs(this.agent.y - this.agent.targetY) > 5) {
                    if (!this.isPlaying || this.isPaused) {
                        await new Promise(resolve => {
                            const checkInterval = setInterval(() => {
                                if (this.isPlaying && !this.isPaused) {
                                    clearInterval(checkInterval);
                                    resolve();
                                }
                            }, 100);
                        });
                        if (!this.isPlaying) return;
                    }

                    // Move towards target
                    const dx = this.agent.targetX - this.agent.x;
                    const dy = this.agent.targetY - this.agent.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance > 0) {
                        this.agent.x += (dx / distance) * this.agent.speed;
                        this.agent.y += (dy / distance) * this.agent.speed;
                    }

                    this.updateAgentPosition();
                    await new Promise(resolve => setTimeout(resolve, 16)); // ~60 FPS
                }

                this.agent.moving = false;
            }

            addMessage(participantId, from, text, isAgent = false) {
                const chatWindow = document.getElementById(`${participantId}-chat`);
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isAgent ? 'agent-message' : 'participant-message'}`;

                const sender = from === 'agent' ? 'Agent' :
                              participantId === 'salon-owner' ? 'Salon Owner' :
                              participantId === 'freelancer' ? 'Freelancer' : 'Agency';

                messageDiv.innerHTML = `<strong>${sender}:</strong><br>${text}`;
                chatWindow.appendChild(messageDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }

            showRecommendation(text) {
                const recommendation = document.getElementById('recommendation');
                const recommendationText = document.getElementById('recommendation-text');
                recommendationText.textContent = text;
                recommendation.style.display = 'block';

                // Scroll to recommendation
                recommendation.scrollIntoView({ behavior: 'smooth' });
            }

            updateStatus(text) {
                document.getElementById('status').textContent = text;
            }

            async executeStep(step) {
                switch (step.type) {
                    case 'move':
                        await this.moveTo(step.target);
                        break;
                    case 'message': {
                        const isAgent = step.from === 'agent';

                        // Work out which panel(s) this line belongs in:
                        // - a broadcast goes to everyone
                        // - an agent line goes to the participant it addresses
                        // - a participant replying to the agent shows in their own panel
                        const panels = step.to === 'all'
                            ? ['salon-owner', 'freelancer', 'agency']
                            : isAgent ? [step.to] : [step.from];

                        panels.forEach(panelId => {
                            if (document.getElementById(`${panelId}-chat`)) {
                                this.addMessage(panelId, step.from, step.text, isAgent);
                            }
                        });
                        break;
                    }
                }

                if (step.delay) {
                    await new Promise(resolve => setTimeout(resolve, step.delay));
                }

                if (step.showRecommendation) {
                    this.showRecommendation(
                        "Based on the salon's budget (₹15,000/month), need for quick turnaround, and focus on Instagram content, the better match is the freelancer (Arjun) at ₹8,000/month. The agency exceeds the budget. I'll facilitate an introduction!"
                    );
                }
            }

            async runSimulation() {
                this.isPlaying = true;
                this.isPaused = false;
                this.updateStatus("Simulation running...");
                document.getElementById('start-btn').disabled = true;
                document.getElementById('pause-btn').disabled = false;
                document.getElementById('reset-btn').disabled = false;
                document.getElementById('step-btn').disabled = true;

                for (this.currentStep = 0; this.currentStep < this.steps.length; this.currentStep++) {
                    if (!this.isPlaying) break;

                    while (this.isPaused && this.isPlaying) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }

                    if (!this.isPlaying) break;

                    await this.executeStep(this.steps[this.currentStep]);

                    // A Reset during that step cancels the run - don't stomp its status.
                    if (!this.isPlaying) break;

                    // Update step indicator
                    this.updateStatus(`Step ${this.currentStep + 1} of ${this.steps.length}`);
                }

                if (this.isPlaying) {
                    this.updateStatus("Simulation complete!");
                    document.getElementById('start-btn').disabled = true;
                    document.getElementById('pause-btn').disabled = true;
                    document.getElementById('reset-btn').disabled = false;
                    document.getElementById('step-btn').disabled = false;
                }
            }

            start() {
                // Clear chats if resetting
                if (this.currentStep === 0) {
                    ['salon-owner', 'freelancer', 'agency'].forEach(id => {
                        document.getElementById(`${id}-chat`).innerHTML = '';
                    });
                    document.getElementById('recommendation').style.display = 'none';
                }

                this.runSimulation();
            }

            pause() {
                this.isPaused = !this.isPaused;
                document.getElementById('pause-btn').textContent = this.isPaused ? 'Resume' : 'Pause';
                this.updateStatus(this.isPaused ? "Simulation paused" : "Simulation running...");
            }

            reset() {
                this.isPlaying = false;
                this.isPaused = false;
                this.currentStep = 0;

                // Reset UI
                ['salon-owner', 'freelancer', 'agency'].forEach(id => {
                    document.getElementById(`${id}-chat`).innerHTML = '';
                });
                document.getElementById('recommendation').style.display = 'none';
                document.getElementById('start-btn').disabled = false;
                document.getElementById('pause-btn').disabled = true;
                document.getElementById('pause-btn').textContent = 'Pause';
                document.getElementById('reset-btn').disabled = true;
                document.getElementById('step-btn').disabled = true;

                // Reset agent position
                this.agent.x = window.innerWidth / 2 - 30;
                this.agent.y = window.innerHeight - 100;
                this.agent.targetX = this.agent.x;
                this.agent.targetY = this.agent.y;
                this.updateAgentPosition();

                this.updateStatus("Simulation reset. Ready to start...");
            }

            step() {
                if (this.currentStep >= this.steps.length) {
                    this.updateStatus("Simulation already complete!");
                    return;
                }

                this.isPlaying = true;
                this.isPaused = false;

                this.executeStep(this.steps[this.currentStep]).then(() => {
                    this.currentStep++;
                    this.updateStatus(`Step ${this.currentStep} of ${this.steps.length}`);

                    if (this.currentStep >= this.steps.length) {
                        this.updateStatus("Simulation complete!");
                        document.getElementById('start-btn').disabled = true;
                        document.getElementById('pause-btn').disabled = true;
                        document.getElementById('reset-btn').disabled = false;
                        document.getElementById('step-btn').disabled = false;
                    } else {
                        document.getElementById('start-btn').disabled = true;
                        document.getElementById('pause-btn').disabled = true;
                        document.getElementById('reset-btn').disabled = false;
                        document.getElementById('step-btn').disabled = false;
                    }
                });
            }
        }

        // Initialize simulation when page loads
        window.addEventListener('load', () => {
            window.simulation = new MatchmakingSimulation();
        });

        // Handle window resizing
        window.addEventListener('resize', () => {
            if (window.simulation) {
                // Keep agent within bounds
                window.simulation.agent.x = Math.max(0, Math.min(window.innerWidth - 60, window.simulation.agent.x));
                window.simulation.agent.y = Math.max(0, Math.min(window.innerHeight - 60, window.simulation.agent.y));
                window.simulation.agent.targetX = window.simulation.agent.x;
                window.simulation.agent.targetY = window.simulation.agent.y;
                window.simulation.updateAgentPosition();
            }
        });
    </script>
</body>
</html>
